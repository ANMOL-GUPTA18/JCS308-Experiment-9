
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>User Authentication</h1>
        <p class="subtitle">Register or login to access your profile</p>

        <div class="form-box">
            <h2>Create Account</h2>
            <form id="registerForm">
                <input type="text" id="name" placeholder="Full Name" required>
                <input type="email" id="regEmail" placeholder="Email Address" required>
                <input type="password" id="regPassword" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
        </div>

        <div class="form-box">
            <h2>Login</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email Address" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>

        <p id="message"></p>

        <div id="profile" class="profile-box" style="display:none;">
            <h2>My Profile</h2>
            <p id="profileDetails"></p>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>

    <script>
        const message = document.getElementById("message");

        // Register user
        document.getElementById("registerForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const response = await fetch("/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: document.getElementById("name").value,
                    email: document.getElementById("regEmail").value,
                    password: document.getElementById("regPassword").value
                })
            });

            const data = await response.json();
            message.textContent = data.message;
        });

        // Login user
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: document.getElementById("loginEmail").value,
                    password: document.getElementById("loginPassword").value
                })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem("token", data.token);
                message.textContent = data.message;
                loadProfile();
            } else {
                message.textContent = data.message;
            }
        });

        // Load protected profile
        async function loadProfile() {
            const token = localStorage.getItem("token");

            const response = await fetch("/profile", {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            const data = await response.json();

            if (response.ok) {
                document.getElementById("profile").style.display = "block";
                document.getElementById("profileDetails").textContent =
                    "Name: " + data.user.name + " | Email: " + data.user.email;
            } else {
                localStorage.removeItem("token");
                message.textContent = data.message;
            }
        }

        // Logout user
        document.getElementById("logoutBtn").addEventListener("click", function() {
            localStorage.removeItem("token");
            document.getElementById("profile").style.display = "none";
            message.textContent = "Logged out successfully. Token removed.";
        });
    </script>

</body>
</html>
